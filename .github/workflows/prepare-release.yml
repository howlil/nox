name: Prepare release PR

# Release preparation is explicitly requested from master, not run after
# every feature merge. Publication must happen on the certified release
# candidate before its manifest bump merges to master.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Infer SemVer from commits by default; choose a manual override when needed"
        required: true
        default: auto
        type: choice
        options: [auto, current, patch, minor, major]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: nox-prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select version bump
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BUMP: ${{ inputs.bump }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA" || {
            echo "::error::Checkout is not the source selected at dispatch."
            exit 1
          }
          current_master="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
          test "$current_master" = "$DISPATCH_SHA" || {
            echo "::error::Master advanced after dispatch; start preparation again."
            exit 1
          }
          if [ "$MANUAL_BUMP" = "auto" ]; then
            bump="$(node scripts/select-release-bump.mjs)"
          else
            bump="$MANUAL_BUMP"
          fi
          if [ "$bump" = "none" ]; then
            echo "No releasable changes, or previous release still pending."
            exit 0
          fi
          # Avoid opening parallel release PRs and overwriting in-review metadata.
          open_heads="$(gh pr list --state open --limit 100 --json headRefName --jq '.[].headRefName')"
          if grep -q '^release/' <<< "$open_heads"; then
            echo "Existing release PR must be merged or closed first."
            exit 0
          fi
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
      - name: Generate synchronized manifest, changelog, and compatibility map
        if: steps.select.outputs.bump != ''
        env:
          BUMP: ${{ steps.select.outputs.bump }}
        run: node scripts/prepare-release.mjs "$BUMP"
      - name: Validate metadata and documentation
        if: steps.select.outputs.bump != ''
        run: |
          node scripts/check-release.mjs
          node scripts/check-docs.mjs
      - name: Create release PR and explicitly trigger candidate CI
        if: steps.select.outputs.bump != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DISPATCH_SHA" || {
            echo "::error::Release candidate source changed after dispatch."
            exit 1
          }
          version="$(node -p 'JSON.parse(require("fs").readFileSync(".release-plan.json")).version')"
          branch="release/$version"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            if gh pr list --state open --head "$branch" --json number --jq '.[].number' | grep -q .; then
              echo "Release PR already exists for $branch."
              exit 0
            fi
            echo "::error::Branch $branch already exists without an open PR. Recover it manually; never overwrite."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add manifest.json package.json CHANGELOG.md versions.json .release-plan.json
          git commit -m "chore(release): prepare $version"
          current_master="$(git ls-remote --exit-code origin refs/heads/master | cut -f1)"
          test "$current_master" = "$DISPATCH_SHA" || {
            echo "::error::Master advanced during preparation; refusing to publish a stale release branch."
            exit 1
          }
          git push -u origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "chore(release): prepare $version" \
            --body-file .github/RELEASE_PR_BODY.md
          # GITHUB_TOKEN PR checks may require approval. Dispatch an independent
          # candidate run; do not substitute it for a required PR status.
          gh workflow run ci-release.yml --ref "$branch"
