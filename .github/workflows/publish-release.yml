name: Recover publication of a verified Obsidian draft

# Recovery-only fallback; the normal release path is fully automatic.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.1.3"
        type: string
        required: true
      expected_sha:
        description: "Full merged master commit SHA used for the draft"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: nox-public-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - name: Validate exact approved SHA before source checkout
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Supply a full lowercase 40-character approved commit SHA."
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source and approved draft identity
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA" || {
            echo "::error::Checkout differs from the approved release SHA."
            exit 1
          }
          test "$(gh release view "$VERSION" --json isDraft --jq '.isDraft')" = true || {
            echo "::error::Release must exist and still be a draft."
            exit 1
          }
          target="$(gh release view "$VERSION" --json targetCommitish --jq '.targetCommitish')"
          test "$target" = "$EXPECTED_SHA" || {
            echo "::error::Draft refers to another commit: $target"
            exit 1
          }
          node scripts/check-release.mjs
          test "$(node -p 'require("./package.json").version')" = "$VERSION"

      - name: Require native Obsidian acceptance of the recovered source
        run: node scripts/verify-desktop-acceptance.mjs

      - name: Download and attest the exact draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          expected_assets="$(printf '%s\n' main.js manifest.json styles.css | LC_ALL=C sort)"
          actual_assets="$(gh release view "$VERSION" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          if [ "$actual_assets" != "$expected_assets" ]; then
            echo "::error::Draft must contain exactly main.js, manifest.json and styles.css."
            printf 'Received assets:\n%s\n' "$actual_assets"
            exit 1
          fi
          mkdir -p dist
          gh release download "$VERSION" --dir dist \
            --pattern "main.js" --pattern "manifest.json" --pattern "styles.css"
          for file in main.js manifest.json styles.css; do
            test -s "dist/$file" || exit 1
            gh attestation verify "dist/$file" --repo "$GITHUB_REPOSITORY" --source-digest "$EXPECTED_SHA"
          done
          test "$(node -p 'require("./dist/manifest.json").version')" = "$VERSION"

      - name: Recover publication of exact attested draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --draft=false
          echo "Published verified Nox $VERSION."
