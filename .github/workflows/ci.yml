name: CI

# Obsidian plugin only. Cloudflare owns landing CI/CD.

on:
  push:
    branches: [master]
    paths-ignore: ['landing/**']
  pull_request:
    branches: [master]
    paths-ignore: ['landing/**']
  workflow_dispatch:

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const t = process.env.PR_TITLE ?? ""; if (!/^(feat|fix|docs|chore|refactor|perf|test|ci|build)(\([a-z0-9./_-]+\))?!?: .{3,}$/.test(t)) { console.error("PR title must use Conventional Commits (e.g. feat(chat): add review), got:", t); process.exit(1); }'
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture boundaries
        run: pnpm check:boundaries

      - name: Architecture dependency baseline
        run: pnpm architecture:graph >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Typed trust-boundary lint
        run: pnpm lint:typed

      - name: Critical Obsidian settings policy
        run: pnpm ci:critical

      - name: Parse CSS source stylesheets
        run: pnpm lint:css

      - name: Documentation and release metadata checks
        run: pnpm docs:check && pnpm release:check

      - name: Enforce Obsidian public manifest = published release
        # Staged release PRs intentionally have no public tag until source-bound
        # release certification and source-bound artifact checks pass. Master/push and
        # ordinary PRs must still prove public manifest parity.
        if: ${{ !(github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/')) }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/check-public-release.mjs

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Verify portable core package (standalone ESM/CJS/types)
        run: pnpm core:verify

      - name: Verify single-instance core consumption by both hosts
        run: pnpm core:hosts

      - name: Real browser IndexedDB and NOX engine conformance
        run: pnpm browser:verify

      - name: M7 automated portability and release policy preflight
        run: pnpm acceptance:portable

      - name: Build
        run: pnpm build

      - name: Verify artifacts
        run: pnpm test:artifacts
