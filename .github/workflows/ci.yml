name: CI

# Fast development checks; Windows and full Community validation run in CI / Release.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const t = process.env.PR_TITLE ?? ""; if (!/^(feat|fix|docs|chore|refactor|perf|test|ci|build)(\([a-z0-9./_-]+\))?!?: .{3,}$/.test(t)) { console.error("PR title must use Conventional Commits (e.g. feat(chat): add review), got:", t); process.exit(1); }'
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture boundaries
        run: pnpm check:boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Typed trust-boundary lint
        run: pnpm lint:typed

      - name: Critical Obsidian settings policy
        run: pnpm ci:critical

      - name: Parse CSS source stylesheets
        run: pnpm lint:css

      - name: Documentation and release metadata checks
        run: pnpm docs:check && pnpm release:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Verify artifacts
        run: pnpm test:artifacts
  # Landing is independently deployed by Cloudflare; do not add it to the
  # Obsidian plugin's pnpm workspace or release artifact.
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The landing package currently has no committed npm lockfile.
      # Keep Cloudflare's existing install semantics until a separate
      # lockfile/provenance change can be verified.
      - name: Install landing dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Astro type validation
        run: npm run check
      - name: React type-aware lint
        run: npm run lint
      - name: Landing production build
        run: npm run build

