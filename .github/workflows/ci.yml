name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce conventional PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'const t = process.env.PR_TITLE ?? ""; if (!/^(feat|fix|docs|chore|refactor|perf|test|ci|build)(\([a-z0-9./_-]+\))?!?: .{3,}$/.test(t)) { console.error("PR title must use Conventional Commits (e.g. feat(chat): add review), got:", t); process.exit(1); }'
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Architecture boundaries
        run: pnpm check:boundaries

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Typed trust-boundary lint
        run: pnpm lint:typed

      - name: Parse CSS source stylesheets
        run: pnpm lint:css

      - name: Documentation and release metadata checks
        run: pnpm docs:check && pnpm release:check

      - name: Unit tests
        run: pnpm test:unit

      - name: Integration tests
        run: pnpm test:integration

      # Diagnostic microbenchmark only; never assert a machine-dependent
      # duration threshold in shared CI.
      - name: Synthetic research benchmark
        run: NOX_BENCH_FILES=200 pnpm bench:research

      - name: Build
        run: pnpm build

      - name: Verify artifacts
        run: pnpm test:artifacts
      - name: Reproducible production build
        run: |
          first="$(sha256sum dist/main.js dist/manifest.json dist/styles.css)"
          pnpm build
          second="$(sha256sum dist/main.js dist/manifest.json dist/styles.css)"
          if [ "$first" != "$second" ]; then
            echo "::error::Build changes for the same commit; Community Directory scanner will not match the release."
            exit 1
          fi

      - name: Upload installable assets for pre-release desktop acceptance
        uses: actions/upload-artifact@v4
        with:
          name: nox-desktop-test-${{ github.sha }}
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error
          retention-days: 14

  # Landing is independently deployed by Cloudflare; do not add it to the
  # Obsidian plugin's pnpm workspace or release artifact.
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The landing package currently has no committed npm lockfile.
      # Keep Cloudflare's existing install semantics until a separate
      # lockfile/provenance change can be verified.
      - name: Install landing dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Astro type validation
        run: npm run check
      - name: React type-aware lint
        run: npm run lint
      - name: Landing production build
        run: npm run build

  # The Linux job cannot validate Windows PowerShell / DPAPI.
  # Run the actual local-credential OAuth roundtrip on Windows.
  windows-dpapi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ChatGPT provider regression tests
        run: pnpm exec esbuild tests/agent/ChatGptProvider.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=chatgpt-provider-test.mjs

      - name: Build Obsidian OAuth transport regression tests
        run: pnpm exec esbuild tests/agent/ObsidianOAuthTransport.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=obsidian-oauth-test.mjs

      - name: Build Obsidian inference regression tests
        run: pnpm exec esbuild tests/agent/ObsidianInferenceTransport.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=obsidian-inference-test.mjs

      - name: Windows DPAPI, OAuth and inference regressions
        run: node --test chatgpt-provider-test.mjs obsidian-oauth-test.mjs obsidian-inference-test.mjs

  # Obsidian's own validator catches manifest/compatibility and scanner findings.
  # Use Nox's existing pnpm pipeline for builds; avoid the validator's npm fallback.
  community-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Community Directory scanner validation
        uses: obsidianmd/obsidian-workflows@v1
        with:
          build: "false"
          lint: "false"
          scanner-lint: "true"
          strict: "false"

