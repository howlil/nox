name: Verify and publish Obsidian release

# Obsidian plugin release only; Cloudflare owns the landing deployment.
# Publish staged release/x.y.z commits using workflow_dispatch AFTER native
# acceptance and CI, BEFORE merging the release manifest into master.
# Existing master-triggered recovery remains for already prepared releases.
on:
  push:
    branches: [master]
    paths:
      - '.release-plan.json'
      - 'docs/desktop-acceptance.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-release.yml'
      - '.github/workflows/publish-release.yml'
      - 'src/**'
      - 'styles.css'
      - 'scripts/**'
      - 'tests/**'
      - 'manifest.json'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'versions.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nox-public-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prepared: ${{ steps.check.outputs.prepared }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect unshipped release by ID rather than public tag
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "prepared=false" >> "$GITHUB_OUTPUT"
          node scripts/check-release.mjs
          version="$(node -p 'JSON.parse(require("fs").readFileSync(".release-plan.json")).version')"
          # Publish staged release candidates BEFORE merging their version bump
          # into master. Only explicit dispatches of release/x.y.z may do so.
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            test "$GITHUB_REF_NAME" = "release/$version" || {
              echo "::error::Only release/$version or master may publish NOX $version."
              exit 1
            }
            test "$GITHUB_EVENT_NAME" = "workflow_dispatch" || {
              echo "::error::Candidate publication requires explicit dispatch."
              exit 1
            }
          fi
          echo "Release verification: release registry lookup"
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          published="$(jq -r --arg v "$version" '[.[] | select(.tag_name == $v and .draft == false)] | length' <<< "$releases")"
          test "$published" = 0 || { echo "Already published: $version"; exit 0; }
          draft_id="$(jq -r --arg v "$version" '[.[] | select(.draft == true and (.tag_name == $v or .name == ("Nox " + $v)))][0].id // empty' <<< "$releases")"
          if [ -z "$draft_id" ] && [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! git rev-parse HEAD^ >/dev/null 2>&1 || git diff --quiet HEAD^ HEAD -- .release-plan.json; then
              echo "No new release plan and no pending draft; skip."
              exit 0
            fi
          fi
          if [ -n "$draft_id" ]; then
            echo "Found pending $version draft by release ID $draft_id."
          fi
          echo "prepared=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  desktop-acceptance:
    if: needs.detect.outputs.prepared == 'true'
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify native Obsidian acceptance evidence for this source
        run: node scripts/verify-desktop-acceptance.mjs

  linux:
    if: needs.detect.outputs.prepared == 'true'
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check && pnpm release:check && pnpm ci:critical && pnpm lint:typed && pnpm verify
      # Attest the exact production bytes; no attestations are issued for CI preview builds.
      - name: Attest plugin JavaScript
        uses: actions/attest@v4
        with:
          subject-path: dist/main.js
      - name: Attest plugin CSS
        uses: actions/attest@v4
        with:
          subject-path: dist/styles.css
      - name: Attest plugin manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: nox-community-assets
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error
          retention-days: 7

  community:
    if: needs.detect.outputs.prepared == 'true'
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Official Community scanner (lint enabled; warnings advisory; P0 policy blocking)
        uses: obsidianmd/obsidian-workflows@v1
        with:
          build: "false"
          lint: "true"
          scanner-lint: "true"
          strict: "false"

  windows:
    if: needs.detect.outputs.prepared == 'true'
    needs: detect
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Windows OAuth, DPAPI, and inference regressions
        shell: pwsh
        run: |
          pnpm exec esbuild tests/agent/ChatGptProvider.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=chatgpt-provider-test.mjs
          pnpm exec esbuild tests/agent/ObsidianOAuthTransport.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=obsidian-oauth-test.mjs
          pnpm exec esbuild tests/agent/ObsidianInferenceTransport.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=obsidian-inference-test.mjs
          pnpm exec esbuild tests/agent/NodeInferenceTransport.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=node-inference-test.mjs
          node --test chatgpt-provider-test.mjs obsidian-oauth-test.mjs obsidian-inference-test.mjs node-inference-test.mjs

  release:
    if: needs.detect.outputs.prepared == 'true'
    needs: [detect, linux, windows, community, desktop-acceptance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nox-community-assets
          path: dist
      - name: Verify build provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in main.js styles.css manifest.json; do
            echo "Release verification: attestation for $file"
            gh attestation verify "dist/$file" --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA"
          done
      - name: Extract changelog notes for this exact version
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src = fs.readFileSync('CHANGELOG.md', 'utf8');
          const start = src.indexOf('## [' + process.env.RELEASE_VERSION + ']');
          if (start < 0) throw new Error('Matching changelog section missing.');
          const next = src.indexOf('\n## [', start + 4);
          fs.writeFileSync('release-notes.md', src.slice(start, next < 0 ? undefined : next).trim() + '\n');
          NODE
      - name: Publish only source-bound assets by release ID
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          echo "Release verification: source identity"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(node -p 'require("./dist/manifest.json").version')" = "$version"
          # Enforce exact staged branch HEAD rather than an older candidate or
          # a different master commit. This also supports publish-before-merge.
          ref="$GITHUB_REF_NAME"
          case "$ref" in
            master) ;;
            "release/$version") test "$GITHUB_EVENT_NAME" = "workflow_dispatch" ;;
            *) echo "::error::Invalid release source ref: $ref"; exit 1 ;;
          esac
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref" --jq '.object.sha')"
          test "$current" = "$GITHUB_SHA" || { echo "::error::Source ref moved; require a fresh build."; exit 1; }

          # Draft releases are not addressable through the public /releases/tags API.
          # Find and update them by authenticated REST release ID instead.
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          published="$(jq -r --arg v "$version" '[.[] | select(.tag_name == $v and .draft == false)] | length' <<< "$releases")"
          test "$published" = 0 || { echo "::error::Published releases are immutable."; exit 1; }
          release_id="$(jq -r --arg v "$version" '[.[] | select(.draft == true and (.tag_name == $v or .name == ("Nox " + $v)))][0].id // empty' <<< "$releases")"
          if [ -z "$release_id" ]; then
            gh release create "$version" dist/main.js dist/manifest.json dist/styles.css \
              --title "Nox $version" --notes-file release-notes.md \
              --target "$GITHUB_SHA" --draft
            releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
            release_id="$(jq -r --arg v "$version" '[.[] | select(.draft == true and (.tag_name == $v or .name == ("Nox " + $v)))][0].id // empty' <<< "$releases")"
            test -n "$release_id" || { echo "::error::Cannot resolve new draft ID."; exit 1; }
          else
            echo "Release verification: replacing draft assets"
            existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
            while IFS= read -r asset_id; do
              [ -n "$asset_id" ] || continue
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id"
            done < <(jq -r '.[].id' <<< "$existing")
            for file in main.js manifest.json styles.css; do
              curl --fail --silent --show-error --location --retry 3 \
                -X POST -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/octet-stream" \
                --data-binary "@dist/$file" \
                "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$file" > /dev/null
            done
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f target_commitish="$GITHUB_SHA" -f tag_name="$version" \
              -f name="Nox $version" -f body="$(cat release-notes.md)" > /dev/null
          fi

          echo "Release verification: draft source SHA"
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          jq -e --arg v "$version" --arg sha "$GITHUB_SHA" \
            '(.tag_name == $v or .name == ("Nox " + $v)) and .draft == true and .target_commitish == $sha' <<< "$draft" > /dev/null || {
              echo "::error::Draft metadata mismatch (tag, draft status, or target SHA)."; exit 1;
            }

          # GitHub computes SHA-256 for each uploaded release asset. Verify the
          # remote bytes match the already attested local release artifacts.
          echo "Release verification: remote asset allowlist"
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
          expected="$(printf '%s\n' main.js manifest.json styles.css | LC_ALL=C sort)"
          actual="$(jq -r '.[].name' <<< "$assets" | LC_ALL=C sort)"
          test "$actual" = "$expected" || { echo "::error::Release asset allowlist mismatch."; exit 1; }
          for file in main.js manifest.json styles.css; do
            echo "Release verification: SHA256 digest for $file"
            actual_digest="$(jq -r --arg f "$file" '.[] | select(.name == $f) | .digest' <<< "$assets")"
            expected_digest="sha256:$(sha256sum "dist/$file" | cut -d' ' -f1)"
            test "$actual_digest" = "$expected_digest" || {
              echo "::error::Remote asset digest mismatch: $file"; exit 1;
            }
            gh attestation verify "dist/$file" --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA"
          done
          echo "Release verification: all checks passed; publishing"
          gh api -X PATCH -F draft=false -f tag_name="$version" \
            -f target_commitish="$GITHUB_SHA" "repos/$GITHUB_REPOSITORY/releases/$release_id" > /dev/null
          published_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          jq -e --arg v "$version" --arg sha "$GITHUB_SHA" \
            '.tag_name == $v and .draft == false and .target_commitish == $sha' \
            <<< "$published_release" > /dev/null || {
              echo "::error::Published tag or source SHA mismatch."; exit 1;
            }
          echo "Published verified NOX $version from $GITHUB_SHA."
