name: Verify and publish Obsidian release

# Obsidian plugin release only; Cloudflare owns the landing deployment.
# A pending draft is rebuilt and republished from the exact latest master SHA
# after Linux, Windows and strict Community verification.
on:
  push:
    branches: [master]
    paths:
      - '.release-plan.json'
      - '.github/workflows/release.yml'
      - '.github/workflows/ci.yml'
      - '.github/workflows/ci-release.yml'
      - '.github/workflows/publish-release.yml'
      - 'src/**'
      - 'styles.css'
      - 'scripts/**'
      - 'tests/**'
      - 'manifest.json'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'versions.json'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: nox-public-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      prepared: ${{ steps.check.outputs.prepared }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Detect unshipped release or pending draft
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "prepared=false" >> "$GITHUB_OUTPUT"
          node scripts/check-release.mjs
          version="$(node -p 'JSON.parse(require("fs").readFileSync(".release-plan.json")).version')"
          if gh release view "$version" >/dev/null 2>&1; then
            draft="$(gh release view "$version" --json isDraft --jq .isDraft)"
            if [ "$draft" != true ]; then
              echo "Already published: $version"
              exit 0
            fi
            echo "Refreshing unpublished $version draft from current master."
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            if ! git rev-parse HEAD^ >/dev/null 2>&1 || git diff --quiet HEAD^ HEAD -- .release-plan.json; then
              echo "No merged release plan or existing draft; skip."
              exit 0
            fi
          fi
          echo "prepared=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    if: needs.detect.outputs.prepared == 'true'
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:check && pnpm release:check && pnpm ci:critical && pnpm lint:typed && pnpm verify
      # Attest the exact production bytes; no attestations are issued for CI preview builds.
      - name: Attest plugin JavaScript
        uses: actions/attest@v4
        with:
          subject-path: dist/main.js
      - name: Attest plugin CSS
        uses: actions/attest@v4
        with:
          subject-path: dist/styles.css
      - name: Attest plugin manifest
        uses: actions/attest@v4
        with:
          subject-path: dist/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: nox-community-assets
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error
          retention-days: 7

  community:
    if: needs.detect.outputs.prepared == 'true'
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Official Community scanner (blocking policy)
        uses: obsidianmd/obsidian-workflows@v1
        with:
          build: "false"
          lint: "false"
          scanner-lint: "true"
          strict: "true"

  windows:
    if: needs.detect.outputs.prepared == 'true'
    needs: detect
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Windows OAuth, DPAPI, and inference regressions
        shell: pwsh
        run: |
          pnpm exec esbuild tests/agent/ChatGptProvider.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=chatgpt-provider-test.mjs
          pnpm exec esbuild tests/agent/ObsidianOAuthTransport.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=obsidian-oauth-test.mjs
          pnpm exec esbuild tests/agent/ObsidianInferenceTransport.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=obsidian-inference-test.mjs
          node --test chatgpt-provider-test.mjs obsidian-oauth-test.mjs obsidian-inference-test.mjs

  release:
    if: needs.detect.outputs.prepared == 'true'
    needs: [detect, linux, windows, community]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nox-community-assets
          path: dist
      - name: Verify build provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for file in main.js styles.css manifest.json; do
            gh attestation verify "dist/$file" --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA"
          done
      - name: Extract changelog notes for this exact version
        env:
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const src = fs.readFileSync('CHANGELOG.md', 'utf8');
          const start = src.indexOf('## [' + process.env.RELEASE_VERSION + ']');
          if (start < 0) throw new Error('Matching changelog section missing.');
          const next = src.indexOf('\n## [', start + 4);
          fs.writeFileSync('release-notes.md', src.slice(start, next < 0 ? undefined : next).trim() + '\n');
          NODE
      - name: Publish only verified source-bound release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          test "$(node -p 'require("./package.json").version')" = "$version"
          test "$(node -p 'require("./dist/manifest.json").version')" = "$version"
          if gh release view "$version" >/dev/null 2>&1; then
            test "$(gh release view "$version" --json isDraft --jq .isDraft)" = true || {
              echo "::error::Published releases are immutable."; exit 1;
            }
            gh release upload "$version" dist/main.js dist/manifest.json dist/styles.css --clobber
            gh release edit "$version" --target "$GITHUB_SHA" --notes-file release-notes.md
          else
            gh release create "$version" dist/main.js dist/manifest.json dist/styles.css \
              --title "Nox $version" --notes-file release-notes.md \
              --target "$GITHUB_SHA" --draft
          fi
          test "$(gh release view "$version" --json isDraft --jq .isDraft)" = true
          test "$(gh release view "$version" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA"
          expected="$(printf '%s\n' main.js manifest.json styles.css | LC_ALL=C sort)"
          actual="$(gh release view "$version" --json assets --jq '.assets[].name' | LC_ALL=C sort)"
          test "$actual" = "$expected" || { echo "::error::Release asset allowlist mismatch"; exit 1; }
          mkdir -p release-proof
          gh release download "$version" --dir release-proof \
            --pattern "main.js" --pattern "manifest.json" --pattern "styles.css"
          for item in main.js manifest.json styles.css; do
            test -s "release-proof/$item"
            cmp "dist/$item" "release-proof/$item"
            gh attestation verify "release-proof/$item" --repo "$GITHUB_REPOSITORY" --source-digest "$GITHUB_SHA"
          done
          gh release edit "$version" --draft=false
          echo "Published verified NOX $version from $GITHUB_SHA."
