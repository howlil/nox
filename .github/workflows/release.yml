name: Draft Obsidian release

# A pushed 0.1.0-style tag creates a DRAFT release only.
# Review and publish the draft before submitting to community.obsidian.md.
on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged revision
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install reproducible dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)) {
            throw new Error('Use an exact SemVer tag such as 0.1.0, without v prefix.');
          }
          if (process.env.RELEASE_TAG !== manifest.version || manifest.version !== pkg.version) {
            throw new Error('Tag, manifest.json, and package.json versions must match.');
          }
          if (manifest.id !== 'nox') throw new Error('Unexpected public plugin ID.');
          NODE

      - name: Full verification and production build
        run: pnpm verify

      - name: Confirm release payload
        run: |
          test -s dist/main.js
          test -s dist/manifest.json
          test -s dist/styles.css

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
