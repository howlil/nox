name: CI / Release

# Run heavy release-candidate validation on release PRs or an explicit dispatch.
# Bot-created PR events may require workflow approval in GitHub's merge UI.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-release-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: node scripts/ci/change-scope.mjs

  policy:
    if: needs.changes.outputs.release == 'true'
    needs: changes
    name: release-policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Release metadata and blocking P0 settings policy
        run: pnpm docs:check && pnpm release:check && pnpm ci:critical
      - name: Official Community scanner (lint enabled; warnings advisory; P0 policy blocking)
        uses: obsidianmd/obsidian-workflows@v1
        with:
          build: "false"
          lint: "true"
          scanner-lint: "true"
          strict: "false"

  artifacts:
    if: needs.changes.outputs.release == 'true'
    needs: changes
    name: release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Policy job owns the critical settings check; verify already runs type-aware ESLint.
      - run: pnpm verify
      - name: Prove deterministic production bundle
        shell: bash
        run: |
          set -euo pipefail
          first="$(sha256sum dist/main.js dist/manifest.json dist/styles.css)"
          pnpm build
          second="$(sha256sum dist/main.js dist/manifest.json dist/styles.css)"
          if [ "$first" != "$second" ]; then
            echo "::error::Release build is non-reproducible."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: nox-candidate-${{ github.sha }}
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
          if-no-files-found: error
          retention-days: 14

  windows-dpapi:
    if: needs.changes.outputs.release == 'true'
    needs: changes
    name: windows-dpapi
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Windows OAuth, DPAPI and inference regressions
        shell: pwsh
        run: |
          pnpm exec esbuild tests/agent/ChatGptProvider.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=chatgpt-provider-test.mjs
          pnpm exec esbuild tests/agent/ObsidianOAuthTransport.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=obsidian-oauth-test.mjs
          pnpm exec esbuild tests/agent/ObsidianInferenceTransport.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=obsidian-inference-test.mjs
          pnpm exec esbuild tests/agent/NodeInferenceTransport.test.ts --bundle --platform=node --format=esm --target=node22 --outfile=node-inference-test.mjs
          node --test chatgpt-provider-test.mjs obsidian-oauth-test.mjs obsidian-inference-test.mjs node-inference-test.mjs

  certified:
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
    needs: [changes, policy, artifacts, windows-dpapi]
    name: release-certified
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Require all applicable proofs after successful classification
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          RELEASE_NEEDED: ${{ needs.changes.outputs.release }}
          POLICY: ${{ needs.policy.result }}
          ARTIFACTS: ${{ needs.artifacts.result }}
          WINDOWS: ${{ needs.windows-dpapi.result }}
        run: node scripts/ci/change-scope.mjs certify
